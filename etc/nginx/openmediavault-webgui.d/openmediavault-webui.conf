# openmediavault-webui: serve the new interface at /ui/.
# Included inside OMV's server block. Every add_header set is complete, because add_header in a
# location replaces the ones inherited from the server block (OMV's own headers.conf).
#
# The single source of the UI-1 response headers (docs/05-security.md). The browser test serves the
# production build with the headers read from this file (web/apps/omv-web-app/e2e), and
# tools/lib/nginx-conf.test.mjs checks that every location carries the same security set.
# Verified on the test VM in A1 and A9 (docs/journal.md, 2026-11-19), and with Trusted Types enforced
# in Phase 2 (2026-11-20).

location = /ui {
    absolute_redirect off;
    return 301 /ui/;
}

location ^~ /ui/ {
    alias /var/www/openmediavault-webui/;
    try_files $uri /ui/index.html;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; require-trusted-types-for 'script'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cache-Control "no-cache" always;

    location ^~ /ui/assets/ {
        try_files $uri =404;
        error_page 404 @openmediavault_webui_missing;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; require-trusted-types-for 'script'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

# A missing asset is a plain 404, not OMV's redirect to its own 404 page, and is never cached.
location @openmediavault_webui_missing {
    types { }
    default_type text/plain;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; require-trusted-types-for 'script'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cache-Control "no-store" always;
    return 404 "Not found\n";
}
