# Lint, types, tests, the production build and its UI-1/UI-7/UI-11 checks, the Debian package and
# lintian, the contract and its drift against pinned openmediavault and openmediavault-zfs trees,
# the colour audit and pnpm audit. One job, `build`, which the main branch ruleset requires.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The openmediavault tree the contract's request schemas were read from. Moved deliberately, in
  # the change that re-checks the contract against a new OMV release.
  OMV_REF: babf50d9b305cdced63bbefdb9df0a6d9720bac9
  # The openmediavault-zfs tree (OMV-Extras keeps it in its own repository) that the Zfs
  # operations were read from: its 8.1.4 head. Moved deliberately, like OMV_REF.
  OMV_ZFS_REF: 58525e85724ed55783ff825471c05ff39da60c5d

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the pinned openmediavault tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openmediavault/openmediavault
          ref: ${{ env.OMV_REF }}
          path: omv-source
          persist-credentials: false
          sparse-checkout: |
            deb/openmediavault/usr/share/openmediavault/datamodels
            deb/openmediavault/usr/share/openmediavault/engined/rpc
            deb/openmediavault/var/www/openmediavault/rpc
            deb/openmediavault-md/usr/share/openmediavault/datamodels
            deb/openmediavault-md/usr/share/openmediavault/engined/rpc

      - name: Check out the pinned openmediavault-zfs tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenMediaVault-Plugin-Developers/openmediavault-zfs
          ref: ${{ env.OMV_ZFS_REF }}
          path: omv-zfs-source
          persist-credentials: false
          sparse-checkout: |
            usr/share/openmediavault/datamodels
            usr/share/openmediavault/engined/rpc

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Frozen lockfile; .npmrc sets ignore-scripts and pnpm-workspace.yaml allows no builds (UI-11).
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: Unit tests
        working-directory: web
        run: pnpm test

      - name: Formatting
        working-directory: web
        run: pnpm format:check && pnpm exec prettier --check ../tools/lib ../tools/contract-bootstrap ../tools/contract-capture ../tools/contract-drift ../tools/build-check

      - name: Contract lint
        working-directory: web
        run: pnpm api:spec:lint

      - name: Generated code is up to date
        working-directory: web
        run: |
          pnpm api:spec:build
          pnpm api:react:build
          git diff --exit-code -- . || { echo "::error::Run pnpm api:spec:build and pnpm api:react:build, and commit the result."; exit 1; }

      - name: Build
        working-directory: web
        run: pnpm build

      # What ships: no inline script or style, nothing from another origin, no mock or test code.
      - name: Build checks (UI-1, UI-7, UI-11)
        run: node tools/build-check/check.mjs web/apps/omv-web-app/dist

      # The .deb in Debian 13 from the bundle just built, then lintian (docs/06). Install, upgrade,
      # removal and the broken-snippet rollback are checked on the test VM (tools/package-test).
      - name: Package
        run: make docker-deb

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmediavault-webui-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Tool tests
        run: node --test 'tools/**/*.test.mjs'

      - name: Contract drift against openmediavault
        run: node tools/contract-drift/drift.mjs --omv omv-source --zfs omv-zfs-source

      - name: Colour audit
        run: node tools/colour-audit.mjs contrast --quiet

      - name: Dependency audit
        working-directory: web
        run: pnpm audit
