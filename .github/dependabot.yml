# Workflows pin actions by commit SHA; Dependabot keeps the pins current. The npm workspace is
# under web/; its versions live in the pnpm catalog (web/pnpm-workspace.yaml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # A new release waits a week before Dependabot proposes it.
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
