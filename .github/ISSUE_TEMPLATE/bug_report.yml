name: Bug report
description: Something in the new interface does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not use this form: report it privately
        (see SECURITY.md). Please remove host names, IP addresses, user
        names and serial numbers from anything you paste.
  - type: input
    id: versions
    attributes:
      label: Plugin and openmediavault versions
      placeholder: "openmediavault-webui 8.0.0, OMV 8.6.1"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Firefox 140"
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or screen
      placeholder: "Storage > Shared folders"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: console
    attributes:
      label: Errors shown on the page or in the browser console
      render: text
