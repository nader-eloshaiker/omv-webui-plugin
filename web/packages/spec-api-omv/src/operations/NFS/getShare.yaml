post:
  operationId: nfsGetShare
  tags:
    - NFS
  summary: One NFS share
  description: >-
    One NFS share as stored. The interface reads it immediately before changing it. Changes nothing.
  x-omv-rpc:
    service: NFS
    method: getShare
  x-omv-role: admin
  x-omv-readonly: true
  x-omv-source:
    datamodel: rpc.common.objectuuid
    omvVersion: "8.6.1"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/ObjectUuidRequest.yaml
  responses:
    "200":
      description: "The method's response value."
      content:
        application/json:
          schema:
            $ref: ../../schemas/NfsShare.yaml
          examples:
            one:
              $ref: ../../examples/nfsGetShare.one.yaml
