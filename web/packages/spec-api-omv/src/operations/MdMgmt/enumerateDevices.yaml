post:
  operationId: mdMgmtEnumerateDevices
  tags:
    - MdMgmt
  summary: Software RAID arrays
  description: >-
    Every software RAID array with its member devices, from the RAID plugin (openmediavault-md). The
    server asks mdadm and the kernel's RAID status, and the configuration for whether an array is in
    use; it does not run smartctl. Changes nothing. A member's role (working, spare, rebuilding,
    failed) is not here: `devices` lists failed members and spares alike, and MdMgmt.getDetail says
    which is which. When the plugin is not installed, OMV does not
    know the service and the call fails with HTTP 404, code 0 and the message "RPC service 'MdMgmt'
    not found." (observed on OMV 8.6.1): the transport throws an RpcError with `status` 404, the only
    reply of this method with that status. Read that as "no RAID plugin, so no RAID members"; any
    other failure means the arrays could not be read.
  x-omv-rpc:
    service: MdMgmt
    method: enumerateDevices
  x-omv-role: admin
  x-omv-readonly: true
  responses:
    "200":
      description: "The method's response value."
      content:
        application/json:
          schema:
            $ref: ../../schemas/MdArrayList.yaml
          examples:
            mirrors:
              $ref: ../../examples/mdMgmtEnumerateDevices.mirrors.yaml
            none:
              $ref: ../../examples/mdMgmtEnumerateDevices.none.yaml
            mirror:
              $ref: ../../examples/mdMgmtEnumerateDevices.mirror.yaml
            mirrorSyncing:
              $ref: ../../examples/mdMgmtEnumerateDevices.mirrorSyncing.yaml
            mirrorWithSpare:
              $ref: ../../examples/mdMgmtEnumerateDevices.mirrorWithSpare.yaml
            mirrorRebuilding:
              $ref: ../../examples/mdMgmtEnumerateDevices.mirrorRebuilding.yaml
            mirrorDegraded:
              $ref: ../../examples/mdMgmtEnumerateDevices.mirrorDegraded.yaml
            mirrorReplacing:
              $ref: ../../examples/mdMgmtEnumerateDevices.mirrorReplacing.yaml
            mirrorChecking:
              $ref: ../../examples/mdMgmtEnumerateDevices.mirrorChecking.yaml
            mirrorInUse:
              $ref: ../../examples/mdMgmtEnumerateDevices.mirrorInUse.yaml
            raid5Syncing:
              $ref: ../../examples/mdMgmtEnumerateDevices.raid5Syncing.yaml
            raid5:
              $ref: ../../examples/mdMgmtEnumerateDevices.raid5.yaml
            raid5Reshaping:
              $ref: ../../examples/mdMgmtEnumerateDevices.raid5Reshaping.yaml
            raid5Grown:
              $ref: ../../examples/mdMgmtEnumerateDevices.raid5Grown.yaml
            raid6Syncing:
              $ref: ../../examples/mdMgmtEnumerateDevices.raid6Syncing.yaml
            raid6OneFailed:
              $ref: ../../examples/mdMgmtEnumerateDevices.raid6OneFailed.yaml
            raid6TwoFailed:
              $ref: ../../examples/mdMgmtEnumerateDevices.raid6TwoFailed.yaml
            raid10Syncing:
              $ref: ../../examples/mdMgmtEnumerateDevices.raid10Syncing.yaml
            stripe:
              $ref: ../../examples/mdMgmtEnumerateDevices.stripe.yaml
    "404":
      description: >-
        The RAID plugin is not installed: OMV knows no MdMgmt service. Code 0, message "RPC service
        'MdMgmt' not found.".
      content:
        application/json:
          schema:
            $ref: ../../schemas/RpcErrorDetail.yaml
          examples:
            notInstalled:
              $ref: ../../examples/mdMgmtEnumerateDevices.notInstalled.yaml
