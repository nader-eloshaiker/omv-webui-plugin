post:
  operationId: smartGetInformation
  tags:
    - Smart
  summary: A disk's S.M.A.R.T. details
  description: >-
    What smartctl reports about one disk: model, serial number, firmware, capacity, health and the
    rest of its information section, as display text keyed by name, with the temperature, power
    cycles and power-on hours where OMV finds them. It runs smartctl on the disk without sparing it
    when asleep, so it can wake a sleeping disk: the interface reads it only when the user asks.
    Changes nothing.
  x-omv-rpc:
    service: Smart
    method: getInformation
  x-omv-role: admin
  x-omv-readonly: true
  x-omv-source:
    datamodel: rpc.common.devicefile
    omvVersion: "8.6.1"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/DeviceFileRequest.yaml
  responses:
    "200":
      description: "The method's response value."
      content:
        application/json:
          schema:
            $ref: ../../schemas/SmartInformation.yaml
          examples:
            nvme:
              $ref: ../../examples/smartGetInformation.nvme.yaml
            sata:
              $ref: ../../examples/smartGetInformation.sata.yaml
            ataFailing:
              $ref: ../../examples/smartGetInformation.ataFailing.yaml
