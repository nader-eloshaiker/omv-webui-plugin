post:
  operationId: networkGetInterface
  tags:
    - Network
  summary: One interface's settings
  description: >-
    One interface's stored settings, of any kind, with the name servers and search domains separated by
    commas and a bond's or bridge's ports as a list, ready to be changed and sent back. The transport
    replaces the stored Wi-Fi password by whether one is set (UI-6). Changes nothing.
  x-omv-rpc:
    service: Network
    method: getInterface
  x-omv-role: admin
  x-omv-readonly: true
  x-omv-presence: ["wpapsk"]
  x-omv-source:
    datamodel: rpc.common.objectuuid
    omvVersion: "8.6.1"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/ObjectUuidRequest.yaml
  responses:
    "200":
      description: "The method's response value, with the fields in x-omv-presence as whether they are set."
      content:
        application/json:
          schema:
            $ref: ../../schemas/NetworkInterface.yaml
          examples:
            dhcp:
              $ref: ../../examples/networkGetInterface.dhcp.yaml
            fixed:
              $ref: ../../examples/networkGetInterface.fixed.yaml
            bond:
              $ref: ../../examples/networkGetInterface.bond.yaml
            vlan:
              $ref: ../../examples/networkGetInterface.vlan.yaml
            bridge:
              $ref: ../../examples/networkGetInterface.bridge.yaml
            wifi:
              $ref: ../../examples/networkGetInterface.wifi.yaml
