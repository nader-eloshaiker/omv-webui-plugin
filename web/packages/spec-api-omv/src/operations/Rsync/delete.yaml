post:
  operationId: rsyncDelete
  tags:
    - Rsync
  summary: Delete a copy job
  description: >-
    Remove an rsync job. It touches no file, here or on another computer. The job stops running once
    the pending changes are applied; it marks the rsync module dirty. Returns the removed job; the
    transport removes its password (UI-6).
  x-omv-rpc:
    service: Rsync
    method: delete
  x-omv-role: admin
  x-omv-readonly: false
  x-omv-dirty: true
  x-omv-omit: ["password"]
  x-omv-source:
    datamodel: rpc.common.objectuuid
    omvVersion: "8.6.1"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/ObjectUuidRequest.yaml
  responses:
    "200":
      description: "The method's response value, without the fields in x-omv-omit."
      content:
        application/json:
          schema:
            $ref: ../../schemas/RsyncJobStored.yaml
          examples:
            deleted:
              $ref: ../../examples/rsyncDelete.deleted.yaml
