post:
  operationId: smbGetShareList
  tags:
    - SMB
  summary: Shared folders shared with Windows and Mac computers
  description: >-
    The SMB shares, each as stored with the name of its shared folder. The interface reads the
    whole list. Changes nothing.
  x-omv-rpc:
    service: SMB
    method: getShareList
  x-omv-role: admin
  x-omv-readonly: true
  x-omv-source:
    datamodel: rpc.common.getlist
    omvVersion: "8.6.1"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/GetListRequest.yaml
  responses:
    "200":
      description: "The method's response value."
      content:
        application/json:
          schema:
            $ref: ../../schemas/SmbShareList.yaml
          examples:
            one:
              $ref: ../../examples/smbGetShareList.one.yaml
            none:
              $ref: ../../examples/smbGetShareList.none.yaml
            classicOptions:
              $ref: ../../examples/smbGetShareList.classicOptions.yaml
            turnedOff:
              $ref: ../../examples/smbGetShareList.turnedOff.yaml
    "500":
      description: >-
        The read failed because a share names a shared folder whose record is gone (removed by hand,
        outside OMV's own checks); the message is OMV's internal one.
      content:
        application/json:
          schema:
            $ref: ../../schemas/RpcErrorDetail.yaml
          examples:
            folderGone:
              $ref: ../../examples/smbGetShareList.folderGone.yaml
