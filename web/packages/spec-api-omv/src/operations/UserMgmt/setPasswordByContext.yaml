post:
  operationId: userMgmtSetPasswordByContext
  tags:
    - UserMgmt
  summary: Change my password
  description: >-
    Change the signed-in user's own password. It takes effect at once. The backend does not check
    `_readonly` here; the interface does. For an account OMV manages (not a system account such as
    `admin`), the server also leaves the mail settings, and the SSH settings when the account has
    SSH keys, pending (observed on OMV 8.6.1). Returns null.
  x-omv-rpc:
    service: UserMgmt
    method: setPasswordByContext
  x-omv-role: user
  x-omv-readonly: false
  x-omv-dirty: true
  x-omv-source:
    datamodel: rpc.usermgmt.setpasswordbycontext
    omvVersion: "8.6.1"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/UserMgmtSetPasswordByContextRequest.yaml
  responses:
    "200":
      description: The method returns null.
