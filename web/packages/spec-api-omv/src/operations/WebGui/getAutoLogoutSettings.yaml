    service: WebGui
    method: getAutoLogoutSettings
  x-omv-role: user
  x-omv-readonly: true
  responses:
    "200":
      description: "The method's response value."
      content:
        application/json:
          schema:
            $ref: ../../schemas/AutoLogoutSettings.yaml
          examples:
            admin:
              $ref: ../../examples/webGuiGetAutoLogoutSettings.admin.yaml
            user:
              $ref: ../../examples/webGuiGetAutoLogoutSettings.user.yaml
