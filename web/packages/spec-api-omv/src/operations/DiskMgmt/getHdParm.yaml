post:
  operationId: diskMgmtGetHdParm
  tags:
    - DiskMgmt
  summary: A disk's power settings
  description: >-
    One stored power and cache settings object, by its UUID (the `hdparm.uuid` of DiskMgmt.getList).
    Fails when there is no such object. Read from the configuration; it does not touch the disk.
  x-omv-rpc:
    service: DiskMgmt
    method: getHdParm
  x-omv-role: admin
  x-omv-readonly: true
  x-omv-source:
    datamodel: rpc.common.objectuuid
    omvVersion: "8.6.1"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/ObjectUuidRequest.yaml
  responses:
    "200":
      description: "The method's response value."
      content:
        application/json:
          schema:
            $ref: ../../schemas/HdParm.yaml
          examples:
            configured:
              $ref: ../../examples/diskMgmtGetHdParm.configured.yaml
