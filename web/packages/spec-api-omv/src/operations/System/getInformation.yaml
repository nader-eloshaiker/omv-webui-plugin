post:
  operationId: systemGetInformation
  tags:
    - System
  summary: System information
  description: "Host, version, load and memory, and whether configuration changes are pending. A user gets only the time and host name."
  x-omv-rpc:
    service: System
    method: getInformation
  x-omv-role: user
  x-omv-readonly: true
  responses:
    "200":
      description: "The method's response value."
      content:
        application/json:
          schema:
            $ref: ../../schemas/SystemInformation.yaml
          examples:
            admin:
              $ref: ../../examples/systemGetInformation.admin.yaml
            adminPendingChanges:
              $ref: ../../examples/systemGetInformation.adminPendingChanges.yaml
            user:
              $ref: ../../examples/systemGetInformation.user.yaml
    "401":
      description: No session, or it ended. The first call after the idle timeout says so; later ones say there is no session (A3).
      content:
        application/json:
          schema:
            $ref: ../../schemas/RpcErrorDetail.yaml
          examples:
            notSignedIn:
              $ref: ../../examples/systemGetInformation.notSignedIn.yaml
            sessionExpired:
              $ref: ../../examples/systemGetInformation.sessionExpired.yaml
