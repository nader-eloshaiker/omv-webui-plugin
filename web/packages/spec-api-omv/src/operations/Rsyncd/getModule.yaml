post:
  operationId: rsyncdGetModule
  tags:
    - Rsyncd
  summary: One folder offered to the rsync server
  description: >-
    One rsync server module, with its sign-ins as a list under users. The transport replaces each
    sign-in's stored password in the reply by whether one is set (UI-6). Changes nothing.
  x-omv-rpc:
    service: Rsyncd
    method: getModule
  x-omv-role: admin
  x-omv-readonly: true
  x-omv-presence: ["users[].password"]
  x-omv-source:
    datamodel: rpc.common.objectuuid
    omvVersion: "8.6.1"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/ObjectUuidRequest.yaml
  responses:
    "200":
      description: "The method's response value, with the fields in x-omv-presence as whether they are set."
      content:
        application/json:
          schema:
            $ref: ../../schemas/RsyncdModule.yaml
          examples:
            withSignIn:
              $ref: ../../examples/rsyncdGetModule.withSignIn.yaml
            noSignIn:
              $ref: ../../examples/rsyncdGetModule.noSignIn.yaml
