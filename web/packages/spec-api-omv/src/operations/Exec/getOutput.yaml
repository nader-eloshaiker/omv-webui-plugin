post:
  operationId: execGetOutput
  tags:
    - Exec
  summary: "Read a task's output"
  description: "Used only by the task helper. Not read-only: the last poll of a finished task deletes it on the server (A6)."
  x-omv-rpc:
    service: Exec
    method: getOutput
  x-omv-role: admin
  x-omv-readonly: false
  x-omv-source:
    datamodel: rpc.exec.getoutput
    omvVersion: "8.6.1"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/ExecGetOutputRequest.yaml
  responses:
    "200":
      description: "The method's response value."
      content:
        application/json:
          schema:
            $ref: ../../schemas/ExecOutput.yaml
          examples:
            appliedFinished:
              $ref: ../../examples/execGetOutput.appliedFinished.yaml
            revertedFinished:
              $ref: ../../examples/execGetOutput.revertedFinished.yaml
            smartDevicesFinished:
              $ref: ../../examples/execGetOutput.smartDevicesFinished.yaml
            smartManyBadSectorsFinished:
              $ref: ../../examples/execGetOutput.smartManyBadSectorsFinished.yaml
            smartStatusUnknownFinished:
              $ref: ../../examples/execGetOutput.smartStatusUnknownFinished.yaml
            wipeFinished:
              $ref: ../../examples/execGetOutput.wipeFinished.yaml
            selfTestFinished:
              $ref: ../../examples/execGetOutput.selfTestFinished.yaml
            fsCandidatesFinished:
              $ref: ../../examples/execGetOutput.fsCandidatesFinished.yaml
            fsCandidatesNoneFinished:
              $ref: ../../examples/execGetOutput.fsCandidatesNoneFinished.yaml
            createExt4Finished:
              $ref: ../../examples/execGetOutput.createExt4Finished.yaml
            createBtrfsRaid1Finished:
              $ref: ../../examples/execGetOutput.createBtrfsRaid1Finished.yaml
            zfsDeleteSnapshotFinished:
              $ref: ../../examples/execGetOutput.zfsDeleteSnapshotFinished.yaml
            zfsDeleteFilesystemFinished:
              $ref: ../../examples/execGetOutput.zfsDeleteFilesystemFinished.yaml
            zfsDeletePoolFinished:
              $ref: ../../examples/execGetOutput.zfsDeletePoolFinished.yaml
            rsyncRunFinished:
              $ref: ../../examples/execGetOutput.rsyncRunFinished.yaml
            rsyncTrialFinished:
              $ref: ../../examples/execGetOutput.rsyncTrialFinished.yaml
            rsyncStoppedRunning:
              $ref: ../../examples/execGetOutput.rsyncStoppedRunning.yaml
            rsyncPullRsyncdFinished:
              $ref: ../../examples/execGetOutput.rsyncPullRsyncdFinished.yaml
            emptyRecycleBinFinished:
              $ref: ../../examples/execGetOutput.emptyRecycleBinFinished.yaml
            emptyRecycleBinNothingFinished:
              $ref: ../../examples/execGetOutput.emptyRecycleBinNothingFinished.yaml
    "500":
      description: "The task failed: the message is the task's whole output (for an apply, the Salt log). Also the answer for a handle the server has already deleted (A6)."
      content:
        application/json:
          schema:
            $ref: ../../schemas/RpcErrorDetail.yaml
          examples:
            applyFailed:
              $ref: ../../examples/execGetOutput.applyFailed.yaml
            wipeFailed:
              $ref: ../../examples/execGetOutput.wipeFailed.yaml
            createFailed:
              $ref: ../../examples/execGetOutput.createFailed.yaml
            createBtrfsFailed:
              $ref: ../../examples/execGetOutput.createBtrfsFailed.yaml
            zfsDeletePoolWithFsFailed:
              $ref: ../../examples/execGetOutput.zfsDeletePoolWithFsFailed.yaml
            rsyncHostKeyFailed:
              $ref: ../../examples/execGetOutput.rsyncHostKeyFailed.yaml
            rsyncWrongPasswordFailed:
              $ref: ../../examples/execGetOutput.rsyncWrongPasswordFailed.yaml
            rsyncSecondStartFailed:
              $ref: ../../examples/execGetOutput.rsyncSecondStartFailed.yaml
            rsyncStopped:
              $ref: ../../examples/execGetOutput.rsyncStopped.yaml
            rsyncNotMountedFailed:
              $ref: ../../examples/execGetOutput.rsyncNotMountedFailed.yaml
            rsyncPushSshFailed:
              $ref: ../../examples/execGetOutput.rsyncPushSshFailed.yaml
            emptyRecycleBinBinOffFailed:
              $ref: ../../examples/execGetOutput.emptyRecycleBinBinOffFailed.yaml
            emptyRecycleBinSmbOffFailed:
              $ref: ../../examples/execGetOutput.emptyRecycleBinSmbOffFailed.yaml
