# SPDX-License-Identifier: GPL-3.0-or-later
post:
  operationId: iptablesDeleteRule
  tags:
    - Iptables
  summary: Delete a firewall rule
  description: >-
    Remove one firewall rule, IPv4 or IPv6; the gap it leaves in the numbering is harmless. It marks
    iptables dirty (observed). Returns the removed rule.
  x-omv-rpc:
    service: Iptables
    method: deleteRule
  x-omv-role: admin
  x-omv-readonly: false
  x-omv-dirty: true
  x-omv-destructive: access
  x-omv-source:
    datamodel: rpc.common.objectuuid
    omvVersion: "8.6.1"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/ObjectUuidRequest.yaml
  responses:
    "200":
      description: "The method's response value."
      content:
        application/json:
          schema:
            $ref: ../../schemas/IptablesRule.yaml
          examples:
            removed:
              $ref: ../../examples/iptablesDeleteRule.removed.yaml
