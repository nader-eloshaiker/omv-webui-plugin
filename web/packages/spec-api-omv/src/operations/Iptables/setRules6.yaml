post:
  operationId: iptablesSetRules6
  tags:
    - Iptables
  summary: Put the IPv6 firewall rules in a new order
  description: >-
    Replace every IPv6 firewall rule with the list sent, as setRules does for IPv4: every rule gets a
    new identifier (observed). It marks iptables dirty (observed). Returns the stored rules.
  x-omv-rpc:
    service: Iptables
    method: setRules6
  x-omv-role: admin
  x-omv-readonly: false
  x-omv-dirty: true
  x-omv-destructive: access
  x-omv-source:
    datamodel: rpc.iptables.setrules6
    omvVersion: "8.6.1"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/IptablesSetRules6Request.yaml
  responses:
    "200":
      description: "The method's response value."
      content:
        application/json:
          schema:
            $ref: ../../schemas/IptablesRuleList.yaml
          examples:
            replaced:
              $ref: ../../examples/iptablesSetRules6.replaced.yaml
