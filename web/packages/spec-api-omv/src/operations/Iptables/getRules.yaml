post:
  operationId: iptablesGetRules
  tags:
    - Iptables
  summary: The IPv4 firewall rules
  description: >-
    Every IPv4 firewall rule as stored, in no guaranteed order; the interface sorts them by rulenum. No
    secret. Changes nothing.
  x-omv-rpc:
    service: Iptables
    method: getRules
  x-omv-role: admin
  x-omv-readonly: true
  responses:
    "200":
      description: "The method's response value."
      content:
        application/json:
          schema:
            $ref: ../../schemas/IptablesRuleList.yaml
          examples:
            none:
              $ref: ../../examples/iptablesGetRules.none.yaml
            two:
              $ref: ../../examples/iptablesGetRules.two.yaml
            reordered:
              $ref: ../../examples/iptablesGetRules.reordered.yaml
            allowlist:
              $ref: ../../examples/iptablesGetRules.allowlist.yaml
            classic:
              $ref: ../../examples/iptablesGetRules.classic.yaml
            blocksPage:
              $ref: ../../examples/iptablesGetRules.blocksPage.yaml
