type: object
description: >-
  A scheduled S.M.A.R.T. self-test (rpc.smart.setscheduledtest). Every field is required. The
  schedule fields use patterns that are anchored, accepting exactly the values the stock form
  offers: "*" for every one, or a zero-padded number.
required:
  [uuid, enable, devicefile, comment, type, hour, month, dayofmonth, dayofweek]
properties:
  uuid:
    $ref: ./ObjectUuid.yaml
  enable:
    type: boolean
  devicefile:
    $ref: ./DeviceFile.yaml
  comment:
    type: string
  type:
    type: string
    enum: [S, L, C, O]
    description: >-
      S a short self-test, L a long (extended) one, C a conveyance test (after transport; not every
      disk supports it), O an immediate offline test.
  hour:
    type: string
    pattern: "^(?:[*]|[01][0-9]|2[0-3])$"
    description: '"*" for every hour, or "00" to "23".'
  month:
    type: string
    pattern: "^(?:[*]|0[1-9]|1[0-2])$"
    description: '"*" for every month, or "01" (January) to "12".'
  dayofmonth:
    type: string
    pattern: "^(?:[*]|0[1-9]|[12][0-9]|3[01])$"
    description: '"*" for every day, or "01" to "31".'
  dayofweek:
    type: string
    pattern: "^(?:[*]|[1-7])$"
    description: '"*" for every day, or "1" (Monday) to "7" (Sunday).'
additionalProperties: false
