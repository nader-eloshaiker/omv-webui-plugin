type: object
description: >-
  The signed-in user's new password (rpc.usermgmt.setpasswordbycontext). OMV accepts an empty
  password; the contract does not.
required: [password]
properties:
  password:
    type: string
    format: password
    x-omv-secret: true
    x-omv-format: no-multi-line
    minLength: 1
    pattern: '^[^\r\n]*$'
additionalProperties: false
