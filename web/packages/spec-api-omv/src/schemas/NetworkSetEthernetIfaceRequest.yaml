type: object
description: >-
  A network port's settings, to store (rpc.network.setethernetiface). With OMV's placeholder UUID it
  sets up a port that has none and refuses a second interface of the same kind and name. Every field is required, as in OMV's datamodel, and the object sent replaces the stored one
  (design phase-5-network 0.9). Stricter than OMV: the device name a kernel name; each address an
  address of its family or empty, the netmask a dotted netmask; name servers addresses and search
  domains domain names, separated by commas; the packet size 0 or 576 to 9216; the comment one line
  of at most 255 characters;
  the hardware address an individual one or empty.
required:
  [
    uuid,
    devicename,
    method,
    address,
    netmask,
    gateway,
    routemetric,
    method6,
    address6,
    netmask6,
    gateway6,
    routemetric6,
    dnsnameservers,
    dnssearch,
    mtu,
    wol,
    comment,
    altmacaddress,
  ]
properties:
  uuid:
    $ref: ./ObjectUuid.yaml
  devicename:
    $ref: ./NetworkDeviceName.yaml
  method:
    type: string
    description: How IPv4 is set up - dhcp (automatic), static (a fixed address) or manual (off).
    enum: [dhcp, static, manual]
  address:
    $ref: ./IPv4AddressOrEmpty.yaml
  netmask:
    $ref: ./IPv4NetmaskOrEmpty.yaml
  gateway:
    $ref: ./IPv4AddressOrEmpty.yaml
  routemetric:
    type: integer
    minimum: 0
    maximum: 65535
  method6:
    type: string
    description: How IPv6 is set up - auto (router advertisements), dhcp, static or manual (off).
    enum: [auto, static, manual, dhcp]
  address6:
    $ref: ./IPv6AddressOrEmpty.yaml
  netmask6:
    type: integer
    description: The IPv6 prefix length.
    minimum: 0
    maximum: 128
  gateway6:
    $ref: ./IPv6AddressOrEmpty.yaml
  routemetric6:
    type: integer
    minimum: 0
    maximum: 65535
  dnsnameservers:
    $ref: ./NetworkNameServers.yaml
  dnssearch:
    $ref: ./NetworkSearchDomains.yaml
  mtu:
    $ref: ./NetworkMtu.yaml
  wol:
    type: boolean
    description: Wake-on-LAN.
  comment:
    $ref: ./OneLineComment.yaml
  altmacaddress:
    $ref: ./NetworkMacAddressOrEmpty.yaml
additionalProperties: false
