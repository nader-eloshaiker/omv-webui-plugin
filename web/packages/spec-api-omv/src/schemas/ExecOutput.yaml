type: object
description: >-
  New output of a task since `pos`. The poll that reports `running: false` with nothing pending is
  the last one: the server then deletes the task, and any further call on the handle fails (A6). A
  failed task makes this call itself fail, with the task's output as the message.
required: [filename, pos, output, pendingOutput, running]
properties:
  filename:
    $ref: ./TaskHandle.yaml
  pos:
    type: integer
  output:
    type: string
    description: Plain text since the requested position, line endings normalised to newlines.
  pendingOutput:
    type: boolean
  running:
    type: boolean
