type: string
description: >-
  Who may connect to a folder offered to the rsync server (design phase-5-services 0.4): empty (any
  computer, with the folder's name and password), one computer, or one network, in the forms of
  NetworkClient. "*" is not written: without a sign-in the interface requires one computer or one
  network. OMV takes any text here.
maxLength: 253
pattern: '^(?:|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})(?:/(?:[89]|[12][0-9]|3[0-2]))?|[0-9A-Fa-f]{0,4}(?::[0-9A-Fa-f]{0,4}){2,7}(?:/(?:1[6-9]|[2-9][0-9]|1[01][0-9]|12[0-8]))?|[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*)$'
