type: string
description: >-
  Who may connect (design phase-5-services 0.4), in one of the three forms the interface writes:
  one computer (an IPv4 or IPv6 address, or a computer's name of letters, digits, "." and "-"),
  one network (an IPv4 network from /8 to /32, or an IPv6 network from /16 to /128), or "*" for
  any computer. OMV takes any text here; the contract takes only these forms, so a value set in the
  classic interface in another form is replaced, never sent back. The interface also checks that a
  network is written with its first address, which a pattern cannot.
minLength: 1
maxLength: 253
pattern: '^(?:\*|(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3})(?:/(?:[89]|[12][0-9]|3[0-2]))?|[0-9A-Fa-f]{0,4}(?::[0-9A-Fa-f]{0,4}){2,7}(?:/(?:1[6-9]|[2-9][0-9]|1[01][0-9]|12[0-8]))?|[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*)$'
