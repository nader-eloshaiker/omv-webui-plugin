type: string
description: >-
  An existing pool or file system by its full name, as Zfs.listPools gives it in `path` ("tank",
  "tank/media"; design phase-5-zfs 0.7): the pool's name, then up to 8 parts after "/", each a
  letter or digit first and then up to 63 letters, digits, "_", ".", ":" or "-" (so never "." or
  ".."), 255 characters in all. Stricter than the plugin, which checks nothing.
maxLength: 255
pattern: "^[A-Za-z][A-Za-z0-9_.:-]{0,63}(?:/[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}){0,8}$"
