type: string
description: >-
  One port (1 to 65535) or one range of ports (two joined by "-", or ":" as iptables writes it),
  optionally preceded by "!" for every other, or empty for any. Only with TCP or UDP (the interface
  checks that). OMV takes any text.
maxLength: 12
pattern: "^(?:!?(?:6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3})(?:[-:](?:6553[0-5]|655[0-2][0-9]|65[0-4][0-9]{2}|6[0-4][0-9]{3}|[1-5][0-9]{4}|[1-9][0-9]{0,3}))?)?$"
