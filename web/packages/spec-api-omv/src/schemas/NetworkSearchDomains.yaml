type: string
description: >-
  Search domains, in OMV's domain-name form, separated by commas without spaces, or empty. As
  NetworkNameServers, OMV takes more separators and stores spaces.
maxLength: 1024
pattern: "^(?:[a-zA-Z0-9](?:[-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?(?:[.][a-zA-Z0-9](?:[-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?)*(?:,[a-zA-Z0-9](?:[-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?(?:[.][a-zA-Z0-9](?:[-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?)*)*)?$"
