type: object
description: >-
  A new pool of one group of disks (rpc.zfs.addpool), with the interface's fixed settings (design
  phase-5-zfs 12.1, D11 to D13). Stricter than the plugin: every setting but the layout, the name
  and the disks has the one value the interface sends; the disks are by their stable by-id names;
  and compress and compresstype, which the plugin reads though its datamodel does not declare them,
  are required as "on, LZ4".
required:
  [
    pooltype,
    force,
    mountpoint,
    name,
    devices,
    devalias,
    ashift,
    ashiftval,
    casesensitivity,
    compress,
    compresstype,
  ]
properties:
  pooltype:
    type: string
    description: >-
      How the disks are arranged, in the plugin's words: "mirror" (every disk a copy), "raidz1",
      "raidz2" and "raidz3" (one, two or three disks' worth of parity), or "basic" (one disk, or
      several striped: no protection at all; if one disk fails, everything on the pool is lost).
      The least number of disks is 2 for mirror, 3, 4 and 5 for raidz1 to raidz3, and 1 for basic;
      ZFS refuses fewer, and the interface checks it before calling.
    enum: [mirror, raidz1, raidz2, raidz3, basic]
  force:
    type: boolean
    description: >-
      Whether ZFS may overwrite a disk that looks in use. Accepted only false: the interface never
      forces (D12), so ZFS refuses a disk that holds a pool or a file system.
    enum: [false]
  mountpoint:
    type: string
    description: >-
      The pool's folder. Accepted only empty: ZFS's default, /<name> (D13).
    enum: [""]
  name:
    $ref: ./ZfsNewPoolName.yaml
  devices:
    type: array
    description: >-
      The disks to erase and make into the pool, by the by-id names Zfs.getEmptyCandidates gives,
      each once.
    minItems: 1
    uniqueItems: true
    items:
      $ref: ./ZfsDiskById.yaml
  devalias:
    type: string
    description: >-
      How ZFS is to name the disks. Accepted only "id": by their stable by-id names (D12).
    enum: [id]
  ashift:
    type: boolean
    description: Whether ashiftval is set. Accepted only true (D12).
    enum: [true]
  ashiftval:
    type: integer
    description: The block size as a power of two. Accepted only 12, 4 KiB blocks (D12).
    enum: [12]
  casesensitivity:
    type: string
    description: Whether file names differ by case. Accepted only "sensitive" (D12).
    enum: [sensitive]
  compress:
    type: boolean
    description: >-
      Whether compression is turned on after the pool is made. Read by the plugin though its
      datamodel does not declare it. Accepted only true (D11).
    enum: [true]
  compresstype:
    type: string
    description: >-
      The compression, when compress is true. Read by the plugin though its datamodel does not
      declare it. Accepted only "lz4" (D11).
    enum: [lz4]
additionalProperties: false
