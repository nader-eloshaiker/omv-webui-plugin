type: string
description: >-
  A person's description (the account's comment); may be empty. The system's account tool refuses a
  colon and a line break, so the contract does too, and at most 255 characters. The interface holds
  a description it edits to 65 characters (design phase-5-users D13); a longer one set elsewhere is
  sent back as read.
maxLength: 255
pattern: '^[^:\r\n]*$'
