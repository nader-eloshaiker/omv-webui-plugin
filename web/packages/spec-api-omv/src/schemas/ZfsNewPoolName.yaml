type: string
description: >-
  The name of a new pool (design phase-5-zfs 0.7): 1 to 32 letters, digits, "-" or "_", a letter
  first; not a word ZFS keeps for itself (a name starting with mirror, raidz, draid or spare, or
  "log"), and not the name of a folder the system uses at the top of the disk (bin, boot, dev, etc,
  home, lib, lib32, lib64, media, mnt, opt, proc, root, run, sbin, srv, sys, tmp, usr, var), case
  ignored, because the pool's folder is /<name>. Stricter than the plugin, which refuses only a
  space, and than ZFS. Whether a pool of the name exists already is the interface's own check.
pattern: "^(?!(?:[Mm][Ii][Rr][Rr][Oo][Rr]|[Rr][Aa][Ii][Dd][Zz]|[Dd][Rr][Aa][Ii][Dd]|[Ss][Pp][Aa][Rr][Ee]))(?!(?:[Ll][Oo][Gg]|[Bb][Ii][Nn]|[Bb][Oo][Oo][Tt]|[Dd][Ee][Vv]|[Ee][Tt][Cc]|[Hh][Oo][Mm][Ee]|[Ll][Ii][Bb]|[Ll][Ii][Bb]32|[Ll][Ii][Bb]64|[Mm][Ee][Dd][Ii][Aa]|[Mm][Nn][Tt]|[Oo][Pp][Tt]|[Pp][Rr][Oo][Cc]|[Rr][Oo][Oo][Tt]|[Rr][Uu][Nn]|[Ss][Bb][Ii][Nn]|[Ss][Rr][Vv]|[Ss][Yy][Ss]|[Tt][Mm][Pp]|[Uu][Ss][Rr]|[Vv][Aa][Rr])$)[A-Za-z][A-Za-z0-9_-]{0,31}$"
