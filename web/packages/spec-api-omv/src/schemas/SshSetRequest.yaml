type: object
description: Every field is required (rpc.ssh.set).
required:
  [
    enable,
    port,
    passwordauthentication,
    pubkeyauthentication,
    permitrootlogin,
    tcpforwarding,
    compression,
    extraoptions,
  ]
properties:
  enable:
    type: boolean
  port:
    type: integer
    minimum: 1
    maximum: 65535
  passwordauthentication:
    type: boolean
  pubkeyauthentication:
    type: boolean
  permitrootlogin:
    type: boolean
  tcpforwarding:
    type: boolean
  compression:
    type: boolean
  extraoptions:
    type: string
additionalProperties: false
