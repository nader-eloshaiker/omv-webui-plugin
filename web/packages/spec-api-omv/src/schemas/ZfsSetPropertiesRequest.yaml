type: object
description: >-
  New values for a file system's properties (rpc.zfs.setproperties). Stricter than the plugin,
  which sets any property of a pool, file system, volume or snapshot: only a file system's size
  limit and compression, one of each at most, each marked modified, which the plugin requires
  though its datamodel does not declare it (an item not marked is skipped).
required: [type, name, properties]
properties:
  type:
    type: string
    enum: [Filesystem]
  name:
    $ref: ./ZfsDatasetName.yaml
  properties:
    type: array
    minItems: 1
    maxItems: 2
    items:
      oneOf:
        - $ref: ./ZfsQuotaProperty.yaml
        - $ref: ./ZfsCompressionProperty.yaml
      discriminator:
        propertyName: property
        mapping:
          quota: ./ZfsQuotaProperty.yaml
          compression: ./ZfsCompressionProperty.yaml
additionalProperties: false
