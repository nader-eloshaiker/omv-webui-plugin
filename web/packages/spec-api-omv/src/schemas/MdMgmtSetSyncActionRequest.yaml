type: object
description: >-
  The array and what its disks should do now (rpc.mdmgmt.setsyncaction). Stricter than OMV, which
  also takes "repair": the interface offers no repair, because it rewrites one copy from another
  where they differ, and which copy is right cannot be known from the page.
required: [devicefile, action]
properties:
  devicefile:
    $ref: ./MdArrayDeviceFile.yaml
  action:
    type: string
    description: >-
      "check": read every disk of the array and compare the copies, which takes hours and changes
      nothing. "idle": stop a check that is running.
    enum: [check, idle]
additionalProperties: false
