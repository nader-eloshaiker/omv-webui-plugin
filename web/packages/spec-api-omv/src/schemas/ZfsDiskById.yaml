type: string
description: >-
  A disk, or a partition ZFS made on one, by its stable /dev/disk/by-id/ name: as
  Zfs.getEmptyCandidates gives it for a new disk, and as Zfs.getPoolDevices gives it for a disk in
  a pool ("…-part1" for a whole disk ZFS partitioned). A letter or digit first, then letters,
  digits, ".", "_", ":", "+" or "-", and no "/". Stricter than OMV's device-file format and than the
  plugin, which checks nothing for a disk already in a pool: a disk renamed between a read and the
  call is never hit by mistake, and a pool whose disks ZFS names otherwise (by kernel name or by
  path) is not changed through this contract.
x-omv-format: devicefile
pattern: "^/dev/disk/by-id/[A-Za-z0-9][A-Za-z0-9._:+-]*$"
