type: string
description: >-
  A group's description, stored only in OMV's record; may be empty. Stricter than OMV: one line of
  at most 255 characters. The interface holds a description it edits to 65 characters without a
  colon (design phase-5-users D13); one set elsewhere is sent back as read.
maxLength: 255
pattern: '^[^\r\n]*$'
