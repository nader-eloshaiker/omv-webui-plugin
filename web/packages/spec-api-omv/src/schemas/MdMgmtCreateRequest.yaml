type: object
description: >-
  The disks of a new array and its level (rpc.mdmgmt.create). The server erases and uses every disk
  it is given; it checks neither that a disk is a candidate nor that it is empty. Stricter than OMV:
  at least two disks, each once, and no array name.
required: [devices, name, level]
properties:
  devices:
    type: array
    description: >-
      The disks to erase and make into the array, by their stable /dev/disk/by-id/ names (the
      `devicefile` of DiskMgmt.getList), each once. mdadm accepts these names and the array then
      lists its members by their kernel names (observed on the test VM). The level sets the least
      number the array can be made of: 2 for mirror and stripe, 3 for raid5, 4 for raid6 and raid10
      (the plugin's own form); the interface checks this before calling.
    minItems: 2
    uniqueItems: true
    items:
      $ref: ./DeviceFile.yaml
  name:
    type: string
    description: >-
      The array's own name. Accepted only empty: the interface gives arrays no name, as the stock
      form never does, and mdadm then names the array after the host and its number.
    enum: [""]
  level:
    type: string
    description: >-
      The RAID level, in the plugin's words: "mirror" (RAID1), "raid5", "raid6", "raid10", or
      "stripe" (RAID0). A stripe has no protection at all: if one of its disks fails, everything on
      all of them is lost.
    enum: [mirror, raid5, raid6, raid10, stripe]
additionalProperties: false
