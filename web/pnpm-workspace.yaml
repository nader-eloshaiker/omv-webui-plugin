packages:
  - "apps/*"
  - "packages/*"

# No dependency runs an install script (UI-11). A package that needs one is named here with `true`,
# with the reason, in the pull request that adds it.
allowBuilds:
  esbuild: false
  msw: false

# Versions start from the reference application's catalog (D7). Only what this workspace uses is
# listed; a group is added when the phase that needs it arrives.
catalogs:
  react:
    react: ^19.3.0
    react-dom: ^19.3.0
    # Preferences only (UI-13): the theme choice. Never server data or the session.
    zustand: ^5.0.15
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0

  tanstack:
    "@tanstack/react-query": ^5.104.0
    "@tanstack/react-router": ^1.170.41
    "@tanstack/router-plugin": ^1.168.42

  # Component primitives and the shadcn idiom (D7). Base UI only, inside CSPProvider
  # disableStyleElements: Radix and sonner insert <style> elements, which UI-1 blocks (A9).
  ui:
    "@base-ui/react": ^1.8.0
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    lucide-react: ^1.49.0
    tailwind-merge: ^3.7.0

  forms:
    valibot: ^1.5.0

  # Every user-facing string comes from a catalogue (docs/02, "i18n").
  i18n:
    i18next: ^26.4.2
    react-i18next: ^17.0.15

  api:
    msw: ^3.0.3
    orval: ^8.26.0
    "@redocly/cli": ^2.48.0

  testing:
    # Above the reference's ^20.14.5: versions up to 21.0.3 carry two high advisories (pnpm audit).
    happy-dom: ^21.0.4
    jsdom: ^30.1.1
    vitest: ^5.0.4
    "@testing-library/jest-dom": ^7.0.1
    "@testing-library/react": ^16.3.3
    "@testing-library/user-event": ^14.6.7
    # The browser test (pnpm test:browser): the production build under the nginx snippet's headers.
    # Not part of `pnpm test`; the browser comes from `playwright install`, never an install script.
    "@playwright/test": ^1.63.0

  # Development only: the component review surface. Nothing from it reaches the product bundle.
  storybook:
    storybook: ^10.6.7
    "@storybook/react-vite": ^10.6.7
    "@storybook/addon-docs": ^10.6.7
    "@storybook/addon-themes": ^10.6.7

  style:
    tailwindcss: ^4.3.3
    "@tailwindcss/vite": ^4.3.3

  # Bundled with the interface, never fetched from a font host (UI-7). Variable builds: one file per
  # script subset carries every weight the style guide uses (400, 500, 600). SIL Open Font License.
  fonts:
    "@fontsource-variable/inter": ^5.3.0
    "@fontsource-variable/roboto-mono": ^5.3.0

  build:
    typescript: ~6.0.2
    vite: ^8.3.2
    "@types/node": ^26.6.4
    "@vitejs/plugin-react": ^6.1.1

  lint:
    eslint: ^10.11.0
    eslint-config-prettier: ^10.1.8
    eslint-plugin-prettier: ^5.5.5
    eslint-plugin-react-refresh: ^0.5.7
    globals: ^17.13.0
    prettier: ^3.9.9
    prettier-plugin-organize-imports: ^4.3.0
    typescript-eslint: ^8.71.0
    "@eslint-react/eslint-plugin": ^5.23.3
    "@eslint/js": ^10.0.1
