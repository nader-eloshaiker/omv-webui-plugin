packages:
  - "apps/*"
  - "packages/*"

# No dependency runs an install script (UI-11). A package that needs one is named here with `true`,
# with the reason, in the pull request that adds it.
allowBuilds:
  esbuild: false
  msw: false

# Versions start from the reference application's catalog (D7). Only what this workspace uses is
# listed; a group is added when the phase that needs it arrives.
catalogs:
  react:
    react: ^19.3.0
    react-dom: ^19.3.0
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0

  tanstack:
    "@tanstack/react-query": ^5.104.0

  forms:
    valibot: ^1.5.0

  api:
    msw: ^3.0.3
    orval: ^8.26.0
    "@redocly/cli": ^2.48.0

  testing:
    # Above the reference's ^20.14.5: versions up to 21.0.3 carry two high advisories (pnpm audit).
    happy-dom: ^21.0.4
    vitest: ^5.0.4
    "@testing-library/react": ^16.3.3

  build:
    typescript: ~7.0.2
    "@types/node": ^26.6.4

  lint:
    eslint: ^10.11.0
    eslint-config-prettier: ^10.1.8
    eslint-plugin-prettier: ^5.5.5
    eslint-plugin-react-refresh: ^0.5.7
    globals: ^17.13.0
    prettier: ^3.9.9
    prettier-plugin-organize-imports: ^4.3.0
    typescript-eslint: ^8.71.0
    "@eslint-react/eslint-plugin": ^5.23.3
    "@eslint/js": ^10.0.1
